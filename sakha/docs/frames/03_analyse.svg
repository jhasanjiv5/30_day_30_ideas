<text x="22" y="70" fill="#7ee787">$ sakha analyse --no-model &amp;&amp; sakha list --all</text>
<text x="22" y="89" fill="#e6edf3">Analysed 2 session(s) with rules only: 10 sighting(s), 6 new habit(s) ready for review, 0 re-offered.</text>
<text x="22" y="108" fill="#e6edf3">Waiting for your review — run `sakha review` (6)</text>
<text x="22" y="127" fill="#e6edf3">  h3   ui-design     Prefer calm, Apple-like neutrals with one blue accent colour.</text>
<text x="22" y="146" fill="#e6edf3">  h6   workflow      Never push to main without asking me first.</text>
<text x="22" y="165" fill="#e6edf3">  h1   writing-tone  Use British spelling in everything you write.</text>
<text x="22" y="184" fill="#e6edf3">  h2   writing-tone  Keep responses short and concise.</text>
<text x="22" y="203" fill="#e6edf3">  h4   writing-tone  Don't use emoji.</text>
<text x="22" y="222" fill="#e6edf3">  h5   writing-tone  Avoid exclamation marks.</text>
