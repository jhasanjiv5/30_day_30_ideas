<text x="22" y="184" fill="#e6edf3">&lt;!-- sakha:start --&gt;</text>
<text x="22" y="203" fill="#8b949e">## Preferences learned by Sakha</text>
<text x="22" y="222" fill="#e6edf3"></text>
<text x="22" y="241" fill="#8b949e">### Writing &amp; speaking tone</text>
<text x="22" y="260" fill="#e6edf3">- Use British spelling in everything you write.</text>
<text x="22" y="279" fill="#e6edf3">- Keep answers short: lead with the result, then the details.</text>
<text x="22" y="298" fill="#e6edf3">- Don't use emoji.</text>
<text x="22" y="317" fill="#e6edf3"></text>
<text x="22" y="336" fill="#8b949e">### UI design &amp; colour</text>
<text x="22" y="355" fill="#e6edf3">- Prefer calm, Apple-like neutrals with one blue accent colour.</text>
<text x="22" y="374" fill="#e6edf3"></text>
<text x="22" y="393" fill="#8b949e">### Workflow habits</text>
<text x="22" y="412" fill="#e6edf3">- Never push to main without asking me first.</text>
<text x="22" y="431" fill="#e6edf3">&lt;!-- sakha:end --&gt;</text>
