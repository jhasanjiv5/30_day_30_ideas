<text x="22" y="146" fill="#79c0ff">  “Prefer calm, Apple-like neutrals with one blue accent colour.”</text>
<text x="22" y="165" fill="#e6edf3">  Seen 1× in 1 session(s), strongest signal: explicit, applies everywhere</text>
