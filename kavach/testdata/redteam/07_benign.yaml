- id: ben-16-reviewed-mcp
  category: benign
  description: Invocation of allowlisted trusted-docs MCP server
  hook_event: PreToolUse
  expect_action: ALLOW
  payload:
    hook_event_name: PreToolUse
    tool_name: mcp__trusted-docs__search
    mcp_server:
      name: trusted-docs
      source: user
    tool_input:
      query: "golang context timeout"

